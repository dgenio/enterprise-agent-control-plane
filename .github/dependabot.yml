# Dependabot configuration (issue #152): keep GitHub Actions and Python dependencies current,
# and let Dependabot bump the SHA-pinned actions automatically. Weekly cadence keeps noise low.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
