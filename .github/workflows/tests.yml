name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      # Exercise the full declared support range (issue #151) so requires-python >= 3.10 is
      # actually verified, not just claimed. fail-fast off so one version's failure still
      # reports the others.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: make setup
      - name: Run tests
        run: make test
      - name: Verify a governed audit trace end-to-end
        # Top-level guard (issue #201): a governed run's trace must be schema-complete and
        # its hash chain must verify, catching an orchestration regression a unit test misses.
        run: make verify-trace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install package + dev tooling
        run: pip install -e .[dev]
      - name: Coverage report (non-blocking)
        # Reporting only (issue #175): surfaces which governance paths are exercised without
        # gating the build. A coverage floor can be adopted later once a baseline is known.
        continue-on-error: true
        run: make coverage
