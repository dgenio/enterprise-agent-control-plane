name: vibeguard

on:
  pull_request:

permissions:
  contents: read

jobs:
  vibeguard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the PR base commit so we can diff the proposed change against it.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Self-check (the gate must flag the risky fixture)
        # Proves the gate actually works before we trust its verdict on the PR diff
        # (issue #91): demos/risky_ai_change.diff must be flagged.
        run: python scripts/vibeguard_gate.py --self-check
      - name: Gate the pull request diff
        # Block the merge if the diff widens a money/fallback bound, hides a write by
        # dropping it from WRITE_OR_DESTRUCTIVE, or introduces an outbound network call.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" | python scripts/vibeguard_gate.py --diff -
