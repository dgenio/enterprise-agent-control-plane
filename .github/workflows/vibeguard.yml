name: vibeguard

on:
  pull_request:

permissions:
  contents: read

jobs:
  # The official VibeGuard: artifact-hygiene gate (secrets, risky SQL, packaging /
  # supply-chain drift, AI footprints). Version-pinned and offline after install.
  vibeguard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Install official VibeGuard
        run: pip install vibeguard-gate==0.9.0
      - name: Run the VibeGuard gate
        run: vibeguard gate --fail-on high

  # The domain gate: repo-specific safety regressions the generic tool does not model
  # (a widened money/fallback bound, a capability dropped from WRITE_OR_DESTRUCTIVE, an
  # introduced outbound call) -- the class demos/risky_ai_change.diff demonstrates.
  domain-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Need the PR base commit so we can diff the proposed change against it.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Self-check (the gate must flag the risky fixture)
        # Proves the gate works before we trust its verdict on the PR diff (issue #91).
        run: python scripts/vibeguard_gate.py --self-check
      - name: Gate the pull request diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" | python scripts/vibeguard_gate.py --diff -
