name: evals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    strategy:
      # Match the declared support range (issue #151).
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: make setup
      - name: Run offline evaluation gate
        # Scores candidate routers and policies against the committed golden datasets and
        # fails the build on a regression (router accuracy below floor, or a flipped
        # allow/deny/ask decision). Fully offline; no API keys or network.
        run: make eval
