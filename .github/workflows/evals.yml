name: evals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    strategy:
      # Match the declared support range (issue #151).
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: make setup
      - name: Run offline evaluation gate
        # Scores candidate routers and policies against the committed golden datasets and
        # fails the build on a regression (router accuracy below floor, or a flipped
        # allow/deny/ask decision). Fully offline; no API keys or network.
        run: make eval
