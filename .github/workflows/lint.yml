name: lint

# Lint + format + type gate (issue #150): catches style and type regressions automatically
# alongside the existing tests/evals/docs-health/vibeguard gates. Runtime deps are unchanged;
# the tooling is dev-only and pinned in pyproject's [project.optional-dependencies] dev set.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install package + dev tooling
        run: pip install -e .[dev]
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy
