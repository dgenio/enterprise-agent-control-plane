name: lint

# Lint + format + type gate (issue #150): catches style and type regressions automatically
# alongside the existing tests/evals/docs-health/vibeguard gates. Runtime deps are unchanged;
# the tooling is dev-only and pinned in pyproject's [project.optional-dependencies] dev set.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Install package + dev tooling
        run: pip install -e .[dev]
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy
