name: docs-health

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Check internal docs links and canonical description
        # Dependency-free, offline guard (issue #101): every relative Markdown link in
        # README.md / docs/ must resolve, and the canonical description in METADATA.md must
        # appear verbatim in README.md, pyproject.toml, and CITATION.cff.
        run: python scripts/check_docs_health.py
      - name: Validate control traceability matrix
        # Dependency-free, offline guard (issue #133): each row of
        # docs/control-traceability.md must use a constrained status, name a known library,
        # link to existing code, and reference a tracking issue when not yet Implemented.
        run: python scripts/check_traceability.py
