[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-control-plane"
version = "0.3.0"
description = "Runnable reference architecture for governed enterprise tool-using agents: bounded context, policy gates, audit traces."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dgenio" }]
dependencies = ["pydantic>=2"]
keywords = [
    "ai-agents",
    "agent-governance",
    "agent-control-plane",
    "mcp",
    "tool-using-agents",
    "reference-architecture",
    "ai-safety",
    "agent-security",
    "policy-enforcement",
    "audit-trail",
    "deterministic-workflows",
    "offline-evaluation",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/dgenio/enterprise-agent-control-plane"
Documentation = "https://github.com/dgenio/enterprise-agent-control-plane/blob/main/docs/README.md"
Issues = "https://github.com/dgenio/enterprise-agent-control-plane/issues"

[project.optional-dependencies]
# Dev/CI-only tooling -- not required to run the demo or tests. `dev` installs the official
# VibeGuard pre-merge safety gate (issues #91/#125); `pip install -e .[dev]` then `make vibeguard`.
dev = ["vibeguard-gate==0.9.0"]

[tool.setuptools]
packages = ["enterprise_agent_control_plane"]

[tool.pytest.ini_options]
pythonpath = ["."]
