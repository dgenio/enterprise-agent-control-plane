# Principals and the scoped capability tokens each role is granted (issue #23). Loaded at
# runtime as the single source of truth for ROLE_GRANTS (issue #3). Each granted capability
# is issued as a scoped, optionally-expiring token; a principal must hold a valid token for a
# capability before any policy evaluation runs. tests/test_yaml_parity.py (issue #148) asserts
# every granted capability is a known registry capability.

defaults:
  scope: customer-operations
  issuer: control-plane
  expires: null   # null = non-expiring (demo default)

principals:
  support_agent:
    grants:
      - crm.search_customer
      - billing.get_invoice
      - support.search_tickets
      - docs.search_policy
      - email.draft_reply
      - email.send_reply
      - support.create_task
      - billing.issue_refund
  support_manager:
    grants:
      - crm.search_customer
      - billing.get_invoice
      - support.search_tickets
      - docs.search_policy
      - email.draft_reply
      - email.send_reply
      - support.create_task
      - billing.issue_refund
      - audit.export_case
      # May reveal a Frame's redacted raw detail (issue #114); support_agent may not.
      - frame.expand
  billing_admin:
    grants:
      - crm.search_customer
      - billing.get_invoice
      - billing.issue_refund
      - frame.expand
